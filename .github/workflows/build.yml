name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.6.0"

      - name: Set up Rust
        run: |
          rustup update stable
          rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi
          cargo install cargo-ndk --locked

      - name: Build native library (.so)
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          echo "Using NDK: $ANDROID_NDK_HOME"
          cargo ndk -t arm64-v8a --platform 24 -o app/src/main/jniLibs build --release
          cargo ndk -t armeabi-v7a --platform 21 -o app/src/main/jniLibs build --release
          ls -la app/src/main/jniLibs/*/

      - name: Create signing key and local.properties
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/release.keystore" \
            -alias tgws -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=tg-ws-proxy self-build"
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          KEYSTORE_FILE=$RUNNER_TEMP/release.keystore
          KEYSTORE_PASSWORD=android
          KEY_ALIAS=tgws
          KEY_PASSWORD=android
          EOF

      - name: Build APKs
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Get version and rename APKs
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "APK version: $VERSION"
          for f in app/build/outputs/apk/*/*/*.apk; do
            flavor=$(basename "$(dirname "$(dirname "$f")")")
            mv -v "$f" "app/build/outputs/apk/${flavor}/release/tg-ws-proxy-android_${VERSION}_${flavor}.apk"
          done

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v7
        with:
          name: tg-ws-proxy-android_${{ steps.apk.outputs.version }}_arm64
          path: app/build/outputs/apk/arm64/**/tg-ws-proxy-android_*.apk
          if-no-files-found: error
          archive: false

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v7
        with:
          name: tg-ws-proxy-android_${{ steps.apk.outputs.version }}_arm32
          path: app/build/outputs/apk/arm32/**/tg-ws-proxy-android_*.apk
          if-no-files-found: error
          archive: false

      - name: Upload universal APK
        uses: actions/upload-artifact@v7
        with:
          name: tg-ws-proxy-android_${{ steps.apk.outputs.version }}_universal
          path: app/build/outputs/apk/universal/**/tg-ws-proxy-android_*.apk
          if-no-files-found: error
          archive: false

  create-release:
    if: github.ref == 'refs/heads/tst' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: tg-ws-proxy-android_*
          path: artifacts
          merge-multiple: true

      - name: Show what we got
        run: ls -l artifacts/

      - name: Create latest build
        uses: czietz/action-automatic-releases@latest
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          automatic_release_tag: "latest"
          prerelease: false
          title: Latest Build
          files: artifacts/*.apk
